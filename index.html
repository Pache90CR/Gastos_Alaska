<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Alaska · Gastos y ganancia</title>
    <meta name="theme-color" content="#121c2c">
    <meta name="alaska-version" content="2026.10.29-a">
    <meta name="robots" content="noindex, nofollow">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gastos Alaska">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="179967.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
    <style>
/* ============ TEMA «Marino y Crema» (los colores del logo, igual que Control) ============ */
:root {
    color-scheme: dark;
    --noche: #0b121e; --marino: #121c2c; --marino-2: #1b283e; --marino-3: #2a3b55; --marino-4: #435573;
    --gris-1: #bfc9d8; --gris-2: #98a6bd; --gris-3: #7f92b0; --borde-campo: #6a7f9f;
    --crema: #e8e2d4; --crema-2: #ddd6c4; --papel: #f3efe3; --papel-linea: #c9c2ad;
    --blanco: #f7f3ea; --tinta: #121c2c; --tinta-2: #435573; --enlace-papel: #2b4a80;
    --verde: #4fd6a5; --verde-papel: #07694d; --rojo: #ff7a92; --rojo-papel: #b3123a;
    --alto-nav: 64px; --ancho: 640px;
    --fuente: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--marino); color: var(--blanco);
    background-image: radial-gradient(1100px 480px at 12% -10%, rgba(74, 104, 158, .13), transparent 70%);
    background-repeat: no-repeat; background-attachment: fixed;
    font: 16px/1.45 var(--fuente); font-variant-numeric: tabular-nums; text-rendering: optimizeLegibility;
}
body.bloqueada { overflow: hidden; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
button, input, select, summary, [tabindex] { touch-action: manipulation; }
:focus-visible { outline: 2px solid rgba(232, 226, 212, .85); outline-offset: 2px; }
::placeholder { color: #7487a5; opacity: 1; }

/* ============ Bloqueo con PIN ============ */
.bloqueo { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto;
    background: radial-gradient(900px 520px at 50% -12%, rgba(74, 104, 158, .28), transparent 70%), var(--noche); }
.bloqueo-caja { width: 100%; max-width: 340px; text-align: center; }
.bloqueo-negocio { color: var(--gris-2); font-size: 14px; }
.bloqueo-titulo { margin: 4px 0 16px; font-size: 27px; font-weight: 700; letter-spacing: -.01em; color: var(--crema); }
.bloqueo-msg { min-height: 2.9em; color: var(--gris-1); font-size: 15px; }
.bloqueo-msg-mal { color: var(--rojo); }
.pin-puntos { display: flex; gap: 18px; justify-content: center; margin: 10px 0 24px; }
.pin-puntos span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gris-3); transition: background-color .12s, border-color .12s; }
.pin-puntos .lleno { background: var(--crema); border-color: var(--crema); }
.teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; justify-items: center; }
.tecla { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--marino-3); background: var(--marino-2); color: var(--blanco); font-size: 28px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
.tecla:active:not(:disabled) { background: var(--marino-3); }
.tecla:disabled { opacity: .35; }
.tecla-borrar { background: transparent; border-color: transparent; color: var(--gris-1); }
.sacudir { animation: sacudir .38s ease-in-out; }
@keyframes sacudir { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }

/* ============ Estructura ============ */
.app { max-width: var(--ancho); margin: 0 auto; padding: 0 16px calc(var(--alto-nav) + 104px + env(safe-area-inset-bottom)); }
.cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 0 6px; }
.cab-titulo { font-size: 20px; font-weight: 700; letter-spacing: -.01em; color: var(--crema); }
.cab-negocio { color: var(--gris-2); font-size: 13px; }
.icono-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--gris-1); }
.icono-btn:hover { background: rgba(232, 226, 212, .08); }
.mes { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 0 -16px 10px; padding: 6px 16px;
    background: rgba(18, 28, 44, .96); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(232, 226, 212, .08); }
.mes-flecha { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 0; background: transparent; color: var(--crema); }
.mes-flecha:hover:not(:disabled) { background: rgba(232, 226, 212, .08); }
.mes-flecha:disabled { color: var(--marino-4); }
.mes-centro { display: flex; flex-direction: column; align-items: center; min-height: 44px; justify-content: center; }
.mes-txt { font-size: 18px; font-weight: 650; color: var(--blanco); }
.mes-volver { border: 0; background: none; color: var(--crema); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 2px 8px; min-height: 24px; }
.vista { outline: none; }

.pestanas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
    padding: 0 max(8px, calc((100% - var(--ancho)) / 2 + 8px)) env(safe-area-inset-bottom); height: calc(var(--alto-nav) + env(safe-area-inset-bottom));
    background: rgba(11, 18, 30, .98); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--marino-3); }
.pestana { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; color: var(--gris-2); font-size: 12px; font-weight: 500; min-height: 44px; }
.pestana svg { width: 54px; height: 30px; padding: 3px 15px; border-radius: 15px; box-sizing: border-box; transition: background-color .15s; }
.pestana.activa { color: var(--crema); font-weight: 650; }
.pestana.activa svg { background: rgba(232, 226, 212, .16); }
.pestana-punto { position: absolute; top: 8px; left: calc(50% + 10px); width: 10px; height: 10px; border-radius: 50%; background: var(--rojo); border: 2px solid var(--noche); }

.fab { position: fixed; z-index: 25; right: max(16px, calc((100vw - var(--ancho)) / 2 + 16px)); bottom: calc(var(--alto-nav) + 16px + env(safe-area-inset-bottom));
    height: 54px; padding: 0 22px 0 18px; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 27px; background: var(--crema-2); color: var(--tinta);
    font-size: 16px; font-weight: 700; box-shadow: 0 10px 28px -8px rgba(0, 0, 0, .75), 0 0 0 1px rgba(255, 255, 255, .06) inset; }
.fab:hover { background: var(--crema); }
.fab:active { transform: scale(.98); }

/* ============ Botones ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent;
    background: var(--crema-2); color: var(--tinta); font-size: 16px; font-weight: 650; text-align: center; }
.btn:hover:not(:disabled) { background: var(--crema); }
.btn:active:not(:disabled) { transform: scale(.985); }
.btn-sec { background: var(--marino-2); color: var(--blanco); border-color: var(--marino-4); }
.btn-sec:hover:not(:disabled) { background: var(--marino-3); }
.btn-peligro { background: transparent; color: var(--rojo); border-color: rgba(255, 122, 146, .45); }
.btn-peligro:hover:not(:disabled) { background: rgba(255, 122, 146, .1); }
.btn-peligro-lleno { background: var(--rojo); color: #2a0a12; }
.btn-peligro-lleno:hover:not(:disabled) { background: #ff95a8; }
.btn-chico { min-height: 44px; padding: 0 16px; font-size: 15px; }
.btn-ancho { width: 100%; }
/* Un enlace dentro de una frase se ve chico, pero el dedo lo alcanza: el relleno agranda lo que se toca (44 px) y el margen negativo evita que la frase cambie de tamaño */
.enlace { border: 0; background: none; padding: 13px 8px; margin: -13px -8px; color: var(--crema); font-size: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.enlace-bloque { display: block; min-height: 44px; margin: 4px 0 0; padding: 0; font-size: 15px; }

/* ============ El tiquete (resumen del mes) ============ */
.papel { position: relative; margin: 6px 0 22px; padding: 22px 20px 16px; background: var(--papel); color: var(--tinta); border-radius: 18px 18px 0 0;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 20px 40px -24px rgba(0, 0, 0, .85); }
.papel::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px;
    background: linear-gradient(135deg, var(--papel) 5px, transparent 0) 0 0 / 14px 10px repeat-x, linear-gradient(225deg, var(--papel) 5px, transparent 0) 0 0 / 14px 10px repeat-x; filter: drop-shadow(0 8px 6px rgba(0, 0, 0, .25)); }
.papel-titulo { font-size: 15px; font-weight: 600; color: var(--tinta-2); margin-bottom: 4px; }
.papel-total { font-size: 46px; line-height: 1.05; font-weight: 700; letter-spacing: -.025em; color: var(--tinta); overflow-wrap: anywhere; }
.papel-total-pos { color: var(--verde-papel); }
.papel-total-neg { color: var(--rojo-papel); }
.papel-total-raya { color: var(--tinta-2); }
.papel-sub { margin: 6px 0 16px; font-size: 14.5px; color: var(--tinta-2); }
.libro { border-top: 1.5px dashed var(--papel-linea); padding-top: 10px; }
.libro-fila { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; font-size: 16px; }
.libro-t { flex: 0 1 auto; font-weight: 500; }
.guia { flex: 1 1 12px; min-width: 12px; border-bottom: 2px dotted rgba(18, 28, 44, .28); transform: translateY(-4px); }
.libro-v { flex: none; font-weight: 700; white-space: nowrap; }
.libro-nota { margin: -1px 0 8px; padding-right: 12%; font-size: 13.5px; color: var(--tinta-2); }
.papel .enlace { color: var(--enlace-papel); }
.papel-pie { margin-top: 6px; padding-top: 10px; border-top: 1.5px dashed var(--papel-linea); font-size: 13.5px; color: var(--tinta-2); }
.notas { margin-top: 10px; display: grid; gap: 8px; }
.nota { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--tinta-2); line-height: 1.4; }
.nota svg { flex: none; margin-top: 1px; }
.papel-actualiz { margin-top: 12px; font-size: 13px; color: var(--tinta-2); }
.papel-btn { margin-top: 14px; background: var(--tinta); color: var(--crema); }
.papel-btn:hover:not(:disabled) { background: #1b283e; }
.papel-nota-carga { margin-top: 12px; font-size: 13.5px; color: var(--tinta-2); }

/* ============ Bloques y filas ============ */
.bloque { margin-bottom: 14px; padding: 16px; background: var(--marino-2); border: 1px solid var(--marino-3); border-radius: 16px; }
.bloque-tit { margin-bottom: 10px; font-size: 16px; font-weight: 650; color: var(--crema); }
.bloque-texto { margin-bottom: 12px; font-size: 14.5px; color: var(--gris-1); }
.bloque-nota { margin-top: 8px; font-size: 13px; color: var(--gris-2); }
.bloque-ok { display: flex; align-items: center; gap: 10px; color: var(--verde); font-weight: 600; }
.bloque-total { padding-bottom: 14px; }
.bloque-linea { font-size: 14px; color: var(--gris-2); }
.gran { margin: 2px 0; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; color: var(--blanco); overflow-wrap: anywhere; }
.peq { font-size: 13.5px; color: var(--gris-2); }
.progreso { height: 8px; margin: 10px 0; border-radius: 4px; background: var(--marino-3); overflow: hidden; }
.progreso i { display: block; height: 100%; background: var(--crema-2); border-radius: 4px; }
.banner { margin-bottom: 14px; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255, 122, 146, .45); background: rgba(255, 122, 146, .08); font-size: 14.5px; color: var(--gris-1); }
.banner-tit { margin-bottom: 6px; font-size: 15.5px; font-weight: 650; color: var(--rojo); }
.banner .btn { margin-top: 10px; }
.reglas { margin-top: 10px; }
.reglas summary { min-height: 44px; display: flex; align-items: center; color: var(--crema); cursor: pointer; }
.reglas pre { margin: 6px 0 8px; padding: 12px; overflow-x: auto; background: var(--noche); border-radius: 10px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--gris-1); white-space: pre; }

.dia { margin-bottom: 18px; }
.dia-tit { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 4px 8px; font-size: 14px; font-weight: 600; color: var(--gris-1); }
.dia-total { color: var(--gris-2); font-weight: 500; }
.dia > .filas { background: var(--marino-2); border: 1px solid var(--marino-3); border-radius: 16px; padding: 0 14px; }
.dia > .btn { margin-top: 12px; }
.fila, .fila-pago { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 64px; padding: 10px 0; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--marino-3); }
.filas > li:last-child > .fila, .filas > li:last-child.fila-pago, .filas > .fila-pago:last-child { border-bottom: 0; }
@media (hover: hover) { .fila:hover { background: rgba(232, 226, 212, .05); border-radius: 10px; } }
.fila:active { background: rgba(232, 226, 212, .08); border-radius: 10px; }
.fila-icono { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(232, 226, 212, .09); font-size: 19px; }
.fila-icono-ok { background: rgba(79, 214, 165, .16); color: var(--verde); }
.fila-texto { min-width: 0; display: flex; flex-direction: column; }
.fila-titulo { font-weight: 600; overflow-wrap: anywhere; }
.fila-sub { font-size: 13.5px; color: var(--gris-2); overflow-wrap: anywhere; }
.fila-monto { font-weight: 700; white-space: nowrap; }
.est-vencido .fila-estado { color: var(--rojo); font-weight: 600; }
.est-hoy .fila-estado { color: var(--crema); font-weight: 600; }
.bloque .filas { margin: 0 0 0; }
.bloque .fila-pago:last-child { border-bottom: 0; }

.cats { display: grid; gap: 14px; }
.cat-fila { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: start; }
.cat-emoji { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(232, 226, 212, .09); font-size: 17px; flex: none; }
.cat-linea { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.cat-nombre { font-weight: 600; overflow-wrap: anywhere; }
.cat-monto { font-weight: 700; white-space: nowrap; }
.cat-barra { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.barra { flex: 1; height: 6px; border-radius: 3px; background: var(--marino-3); overflow: hidden; }
.barra i { display: block; height: 100%; border-radius: 3px; background: var(--crema-2); }
.cat-pct { width: 3.2em; text-align: right; font-size: 13px; color: var(--gris-2); }
.cat-aparte { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--marino-4); font-size: 13.5px; color: var(--gris-2); }

.hist { display: grid; gap: 2px; }
.hist-fila { width: 100%; display: grid; grid-template-columns: 6.6em minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; padding: 4px 8px; margin: 0 -8px; width: calc(100% + 16px); border: 0; border-radius: 10px; background: none; text-align: left; }
.hist-fila:hover { background: rgba(232, 226, 212, .05); }
.hist-activo { background: rgba(232, 226, 212, .09); }
.hist-mes { font-size: 14.5px; }
.hist-barra { height: 8px; border-radius: 4px; background: var(--marino-3); overflow: hidden; display: block; }
.hist-barra i { display: block; height: 100%; border-radius: 4px; background: var(--crema-2); }
.hist-barra i.neg { background: var(--rojo); }
.hist-monto { font-weight: 650; font-size: 14.5px; white-space: nowrap; }
.neg { color: var(--rojo); }

.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
/* Con mouse no se desliza hacia los lados: las categorías pasan a la línea de abajo para que todas se alcancen */
@media (hover: hover) and (pointer: fine) { .chips { flex-wrap: wrap; overflow-x: visible; margin-inline: 0; padding-inline: 0; } }
.chip { flex: none; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--marino-4); background: var(--marino-2); color: var(--gris-1); font-size: 14.5px; font-weight: 500; white-space: nowrap; }
.chip-on { background: var(--crema-2); color: var(--tinta); border-color: transparent; font-weight: 650; }
.chip-n { margin-left: 4px; opacity: .7; font-size: 13px; }

.vacio { padding: 36px 8px 24px; text-align: center; }
.vacio-tit { font-size: 18px; font-weight: 650; color: var(--crema); margin-bottom: 8px; }
.vacio-texto { max-width: 34em; margin: 0 auto 18px; color: var(--gris-1); font-size: 15px; }

.opciones { display: grid; gap: 10px; }
.opcion { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; text-align: left; border-radius: 14px; border: 1px solid var(--marino-4); background: var(--marino); color: var(--gris-1); }
.opcion-on { border-color: var(--crema); background: rgba(232, 226, 212, .08); color: var(--blanco); }
.opcion-marca { width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--gris-3); display: block; position: relative; }
.opcion-on .opcion-marca { border-color: var(--crema); }
.opcion-on .opcion-marca::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--crema); }
.opcion-texto { display: flex; flex-direction: column; gap: 4px; }
.opcion-tit { font-weight: 650; font-size: 15.5px; color: var(--blanco); }
.opcion-tit small { font-weight: 500; color: var(--crema); font-size: 12.5px; }
.opcion-desc { font-size: 13.5px; line-height: 1.4; }
.botones-fila { display: flex; flex-wrap: wrap; gap: 10px; }
.botones-fila .btn { flex: 1 1 100px; }
.version { margin: 22px 0 8px; text-align: center; font-size: 12.5px; color: var(--gris-3); }

.esqueleto { position: relative; overflow: hidden; border-radius: 8px; background: rgba(128, 128, 128, .16); background: color-mix(in srgb, currentColor 12%, transparent); }
.esqueleto::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, currentColor 14%, transparent), transparent); animation: brillo 1.5s linear infinite; }
@keyframes brillo { to { transform: translateX(100%); } }
.esq-grande { height: 50px; width: 70%; margin: 8px 0 14px; }
.esq-linea { height: 18px; margin: 10px 0; }
.esq-corta { width: 55%; }

/* ============ Aviso breve ============ */
.aviso { position: fixed; z-index: 60; left: 16px; right: 16px; max-width: 560px; margin: 0 auto; bottom: calc(var(--alto-nav) + 16px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 8px 10px 16px; border-radius: 14px; background: var(--crema); color: var(--tinta);
    font-size: 15px; font-weight: 600; box-shadow: 0 14px 34px -10px rgba(0, 0, 0, .8); opacity: 0; visibility: hidden; transform: translateY(10px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s; }
.aviso-visible { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }
body.con-fab .aviso { bottom: calc(var(--alto-nav) + 86px + env(safe-area-inset-bottom)); }
.aviso-error { background: #ffd9df; color: #4a0b1a; }
.aviso-btn { flex: none; min-height: 44px; padding: 0 12px; border: 0; background: none; color: #1c3a6e; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.aviso-error .aviso-btn { color: #7a0f2a; }

/* ============ Hojas (formularios) ============ */

<script>
/* ===================== CUENTAS DEL NEGOCIO (reportes) =====================
   A partir de las ventas que ya guarda el programa calcula: ventas, costo y ganancia, productos más vendidos,
   ventas por hora y por día de la semana. No usa pantalla ni base de datos: recibe las ventas y los productos y devuelve números.
   - Cada producto (o cada tamaño) puede tener un «costo». Sin costo no se inventa nada: esa venta cuenta como venta,
     pero no entra en la ganancia, y el reporte avisa cuánto de lo vendido tiene el costo completo.
   - El costo que se usa es el que tiene el producto hoy (estimado), no el de cuando se vendió.
   - Los cobros de cuentas fiadas no traen detalle de productos: se muestran aparte y no entran en ganancia, productos ni horas.
   - Las ventas de madrugada (antes de las 5 a. m.) cuentan para el día anterior en el reporte por día de la semana.
   Vive en window.AlaskaReportes. */
(function (raiz) {
    'use strict';

    var FIADO = 'Pago de Cuenta Fiada';
    var CORTE_MADRUGADA_H = 5;

    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function costoValido(x) {
        var n = (typeof x === 'string' && x.trim() !== '') ? Number(x) : x;
        return (typeof n === 'number' && isFinite(n) && n >= 0) ? n : null;   // el 0 vale (cortesías, agua de la llave...)
    }
    function precioValido(x) { return (typeof x === 'number' && isFinite(x)) ? x : 0; }
    function fechaCorta(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
    function claveDia(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function inicioDia(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0); }
    function finDia(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999); }
    function deTexto(s) { var p = String(s).split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 0, 0, 0, 0); }

    // ---------- Periodos ----------
    // clave: 'turno' | 'hoy' | '7d' | 'mes' | 'mesPasado' | 'rango'.  opc: { aperturaISO, desde:'AAAA-MM-DD', hasta:'AAAA-MM-DD' }
    function periodo(clave, ahora, opc) {
        opc = opc || {};
        ahora = ahora || new Date();
        var desde, hasta, texto;
        if (clave === 'turno' && opc.aperturaISO) {
            desde = new Date(opc.aperturaISO); hasta = ahora;
            texto = 'turno abierto el ' + fechaCorta(desde);
        } else if (clave === 'hoy') {
            desde = inicioDia(ahora); hasta = finDia(ahora);
            texto = 'hoy ' + fechaCorta(ahora);
        } else if (clave === 'mes') {
            desde = new Date(ahora.getFullYear(), ahora.getMonth(), 1, 0, 0, 0, 0); hasta = finDia(ahora);
            texto = 'del ' + fechaCorta(desde) + ' al ' + fechaCorta(ahora);
        } else if (clave === 'mesPasado') {
            desde = new Date(ahora.getFullYear(), ahora.getMonth() - 1, 1, 0, 0, 0, 0);
            hasta = finDia(new Date(ahora.getFullYear(), ahora.getMonth(), 0));
            texto = 'del ' + fechaCorta(desde) + ' al ' + fechaCorta(hasta);
        } else if (clave === 'rango') {
            desde = inicioDia(deTexto(opc.desde || claveDia(ahora)));
            hasta = finDia(deTexto(opc.hasta || claveDia(ahora)));
            texto = claveDia(desde) === claveDia(hasta) ? 'el ' + fechaCorta(desde) : 'del ' + fechaCorta(desde) + ' al ' + fechaCorta(hasta);
        } else { // '7d' (y cualquier otra cosa): los últimos 7 días, contando hoy
            var d0 = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() - 6);
            desde = inicioDia(d0); hasta = finDia(ahora);
            texto = 'del ' + fechaCorta(desde) + ' al ' + fechaCorta(ahora);
        }
        return { clave: clave, desde: desde, hasta: hasta, desdeISO: desde.toISOString(), hastaISO: hasta.toISOString(), texto: texto };
    }

    // ---------- Productos ----------
    function indexar(productos) {
        var porId = {}, lista = [];
        (productos || []).forEach(function (p) {
            if (!p || p.nombre == null) return;
            lista.push(p);
            if (p.id != null) porId[p.id] = p;
        });
        return { porId: porId, lista: lista };
    }

    // Los nombres con que se pudo vender un producto (o un tamaño): el de hoy y los que tuvo antes de que le cambiaran el nombre (campo nombresAnteriores)
    function nombresDe(x) {
        if (!x) return [];
        var out = [x.nombre];
        if (Array.isArray(x.nombresAnteriores)) for (var i = 0; i < x.nombresAnteriores.length; i++) if (typeof x.nombresAnteriores[i] === 'string') out.push(x.nombresAnteriores[i]);
        return out;
    }
    // El tamaño de un producto al que corresponde una línea vendida («Hamburguesa (Normal)»), o null
    function tamanoVendido(prod, nombre) {
        var np = nombresDe(prod);
        for (var k = 0; k < prod.variantes.length; k++) {
            var nv = nombresDe(prod.variantes[k]);
            for (var a = 0; a < np.length; a++) for (var b = 0; b < nv.length; b++) if (nombre === np[a] + ' (' + nv[b] + ')') return prod.variantes[k];
        }
        return null;
    }

    // A qué producto (y tamaño) corresponde una línea vendida y cuánto cuesta (null = no se sabe)
    function buscar(item, idx) {
        var nombre = String(item.nombre == null ? '' : item.nombre);
        var prod = (item.id != null && idx.porId[item.id]) || null;
        var i;
        if (!prod) for (i = 0; i < idx.lista.length; i++) if (idx.lista[i].nombre === nombre) { prod = idx.lista[i]; break; }
        if (!prod) for (i = 0; i < idx.lista.length; i++) if (nombre.indexOf(idx.lista[i].nombre + ' (') === 0) { prod = idx.lista[i]; break; }
        if (!prod) return { prod: null, costo: null };
        var costo = null;
        if (prod.variantes && prod.variantes.length) {
            var t = tamanoVendido(prod, nombre);
            if (t) costo = costoValido(t.costo);
            else if (nombresDe(prod).indexOf(nombre) >= 0) costo = costoValido(prod.costo);     // se vendió antes de que el producto tuviera tamaños
        } else costo = costoValido(prod.costo);
        return { prod: prod, costo: costo };
    }

    // Todo lo que se puede vender: cada producto, o cada tamaño si tiene tamaños. Sirve para la pantalla de costos
    function lineasCatalogo(productos) {
        var out = [];
        (productos || []).forEach(function (p) {
            if (!p || p.nombre == null) return;
            var cat = String(p.categoria || 'SIN CATEGORÍA').toUpperCase();
            if (p.variantes && p.variantes.length) {
                p.variantes.forEach(function (v, i) {
                    out.push({ clave: p.id + '|' + p.nombre + ' (' + v.nombre + ')', productoId: p.id, variante: i, nombre: p.nombre + ' (' + v.nombre + ')', categoria: cat, precio: precioValido(v.precio), costo: costoValido(v.costo) });
                });
            } else {
                out.push({ clave: p.id + '|' + p.nombre, productoId: p.id, variante: -1, nombre: p.nombre, categoria: cat, precio: precioValido(p.precio), costo: costoValido(p.costo) });
            }
        });
        return out;
    }

    function esFiado(v) { return !!(v && v.items && v.items.length === 1 && v.items[0] && v.items[0].nombre === FIADO); }

    // ---------- Cálculo principal ----------
    function calcular(ventas, productos) {
        var idx = indexar(productos);
        var r = {
            numVentas: 0, ventasTotal: 0, ticketPromedio: 0,
            metodos: { Efectivo: 0, Tarjeta: 0, SINPE: 0, Otros: 0 },
            fiados: { cantidad: 0, total: 0 },
            ventasProductos: 0, ventasConCosto: 0, costoTotal: 0, ganancia: 0, margen: null, cobertura: null,
            unidades: 0, lineas: [], horas: [], dias: [], porDia: []

        return;
    }
    pin.verificando = false;
    pin.digitos = '';
    pintarPin();
    if (bien) {
        guardarEstadoPin({ f: 0, h: 0, b: 0 });
        desbloquear();
        return;
    }
    const e = estadoPin();
    e.f++;
    const caja = document.querySelector('.bloqueo-caja');
    if (caja) { caja.classList.remove('sacudir'); void caja.offsetWidth; caja.classList.add('sacudir'); }
    if (e.f >= 5) {
        const espera = Math.min(300, 30 * Math.pow(2, e.b));
        e.b++; e.f = 0; e.h = Date.now() + espera * 1000;
        guardarEstadoPin(e);
        revisarEspera();
    } else {
        guardarEstadoPin(e);
        const quedan = 5 - e.f;
        mensajePin('PIN incorrecto' + (quedan <= 2 ? ' · te ' + (quedan === 1 ? 'queda 1 intento' : 'quedan ' + quedan + ' intentos') : ''), true);
    }
}

function bloquear(motivo) {
    const estaba = S.desbloqueado;
    S.desbloqueado = false;
    pin.digitos = ''; pin.verificando = false; pintarPin();
    if (hojaEl.open) hojaEl.close();
    const c = $('confirmar'); if (c.open) c.close();
    ocultarAviso();
    $('vista').innerHTML = ''; $('vista').__html = '';
    hojaEl.innerHTML = ''; c.innerHTML = ''; $('aviso').innerHTML = '';       // no queda ningún dato escondido en la página mientras está bloqueada
    $('app').hidden = true; $('pestanas').hidden = true; $('fab').hidden = true;
    $('bloqueo').hidden = false;
    document.body.classList.add('bloqueada');
    mensajePin(motivo === 'inactividad' && estaba ? 'Se bloqueó por inactividad. Escribe el PIN' : 'Escribe el PIN de administrador', false);

}
function desbloquear() {
    S.desbloqueado = true;
    S.actividad = Date.now();
    actualizarFechas();
    $('bloqueo').hidden = true;
    $('app').hidden = false; $('pestanas').hidden = false;

}


// ===================== DATOS: lo que se lee y se escribe en la base de datos =====================
let renderPendiente = false;
function pedirRender() {                         // varios cambios seguidos se dibujan una sola vez
    if (renderPendiente) return;
    renderPendiente = true;
    Promise.resolve().then(() => { renderPendiente = false; render(); });
}
function conTiempo(promesa, ms) {
    return new Promise((resolver, rechazar) => {
        const t = setTimeout(() => { const e = new Error('Sin respuesta de la base de datos'); e.code = 'tiempo'; rechazar(e); }, ms);
        promesa.then((v) => { clearTimeout(t); resolver(v); }, (e) => { clearTimeout(t); rechazar(e); });
    });
}
function codigoError(e) { return e && e.code ? String(e.code).replace(/^firestore\//, '') : ''; }
function textoError(e) {
    const c = codigoError(e);
    if (c === 'permission-denied') return 'Firebase no deja hacer esto todavía (faltan permisos).';
    if (c === 'resource-exhausted') return 'Firebase llegó al límite de lecturas del día. Inténtalo más tarde.';
    if (c === 'unavailable' || c === 'tiempo' || c === 'deadline-exceeded' || c === 'cancelled' || /offline|network/i.test(String(e && e.message))) return 'Sin conexión con la base de datos.';
    return 'No se pudo completar. Inténtalo de nuevo.';
}
S.permisos = [];                                 // colecciones que Firebase no dejó usar (para mostrar qué falta permitir)
function anotarPermiso(e, coleccion) {
    if (codigoError(e) !== 'permission-denied') return;
    if (S.permisos.indexOf(coleccion) < 0) S.permisos.push(coleccion);
}

// ---------- Lo que llega de la base de datos se revisa antes de usarlo ----------
function normalizarGasto(id, d) {
    if (!d || typeof d !== 'object' || !L.fechaValida(d.fecha)) return null;
    return {
        id: id, monto: L.montoSeguro(d.monto), categoria: L.textoSeguro(d.categoria, 40) || 'otros', catNombre: L.textoSeguro(d.catNombre, 30),
        concepto: L.textoSeguro(d.concepto, 80), fecha: d.fecha, periodo: L.mesDe(d.fecha), metodo: L.METODOS.indexOf(d.metodo) >= 0 ? d.metodo : '',
        fijoId: typeof d.fijoId === 'string' ? d.fijoId : '', ocurrencia: typeof d.ocurrencia === 'string' ? d.ocurrencia : '', creado: typeof d.creado === 'string' ? d.creado : ''
    };
}
function normalizarFijo(id, d) {
    if (!d || typeof d !== 'object') return null;
    const nombre = L.textoSeguro(d.nombre, 60);
    if (!nombre) return null;
    const frecuencia = ['mensual', 'quincenal', 'semanal'].indexOf(d.frecuencia) >= 0 ? d.frecuencia : 'mensual';
    let dia = Math.floor(L.numeroSeguro(d.dia));
    if (frecuencia === 'mensual') dia = Math.min(31, Math.max(1, dia || 1));        // un día que no existe se lee como el más cercano (así lo que se ve coincide con lo que se cuenta)
    else if (frecuencia === 'semanal') dia = (dia >= 0 && dia <= 6) ? dia : 6;
    else dia = 0;
    return {
        id: id, nombre: nombre, categoria: L.textoSeguro(d.categoria, 40) || 'otros', catNombre: L.textoSeguro(d.catNombre, 30), monto: L.montoSeguro(d.monto), variable: !!d.variable,
        frecuencia: frecuencia, dia: dia,
        cadaMeses: L.CADA_MESES.indexOf(Number(d.cadaMeses)) >= 0 ? Number(d.cadaMeses) : 1,
        desde: L.fechaValida(d.desde) ? d.desde : '', hasta: L.fechaValida(d.hasta) ? d.hasta : '', metodo: L.METODOS.indexOf(d.metodo) >= 0 ? d.metodo : '', nota: L.textoSeguro(d.nota, 120), creado: typeof d.creado === 'string' ? d.creado : ''
    };
}
function normalizarConfig(d) {
    const lista = Array.isArray(d && d.categorias) ? d.categorias : [];
    return {
        modo: d && d.modoMercaderia === 'compras' ? 'compras' : 'productos',
        categorias: lista.filter((c) => c && typeof c.id === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(c.id) && typeof c.nombre === 'string' && L.textoSeguro(c.nombre, 30)).slice(0, 40)
            .map((c) => ({ id: c.id, nombre: L.textoSeguro(c.nombre, 30), emoji: L.primerEmoji(c.emoji) }))
    };
}

// ---------- Escuchar los datos propios (se actualizan solos, también desde otro celular) ----------
let resolverResumenes = null;
const listoResumenes = new Promise((r) => { resolverResumenes = r; });
function esperarResumenes() { return Promise.race([listoResumenes, new Promise((r) => setTimeout(r, 6000))]); }

function suscribirGastos(desde) {
    if (S.cancelGastos) S.cancelGastos();
    S.desdeGastos = desde;
    if (!S.gastos.length) S.gastosEstado = 'cargando';
    S.cancelGastos = onSnapshot(query(collection(db, 'gastos'), where('periodo', '>=', desde)), (snap) => {
        const lista = [];
        snap.forEach((d) => { const g = normalizarGasto(d.id, d.data()); if (g) lista.push(g); });
        S.gastos = lista; S.gastosEstado = 'ok'; S.gastosError = '';
        pedirRender();
    }, (e) => {
        console.error('Gastos:', e);
        S.gastosEstado = 'error'; S.gastosError = textoError(e); anotarPermiso(e, 'gastos');
        pedirRender();
    });
}
function asegurarGastosDesde(mes) { if (db && S.iniciado && mes < S.desdeGastos) suscribirGastos(mes); }

function iniciarDatos() {
    if (!db) {
        S.gastosEstado = S.fijosEstado = S.configEstado = 'error';
        S.gastosError = S.fijosError = S.configError = errorFirebase || 'No se pudo conectar con la base de datos.';
        resolverResumenes();
        return;
    }
    suscribirGastos(L.sumarMeses(S.mesActual, -MESES_HISTORIAL));
    S.cancelFijos = onSnapshot(collection(db, 'gastos_fijos'), (snap) => {
        const lista = [];
        snap.forEach((d) => { const f = normalizarFijo(d.id, d.data()); if (f) lista.push(f); });
        S.fijos = lista; S.fijosEstado = 'ok'; S.fijosError = '';
        pedirRender();
    }, (e) => { console.error('Gastos fijos:', e); S.fijosEstado = 'error'; S.fijosError = textoError(e); anotarPermiso(e, 'gastos_fijos'); pedirRender(); });
    S.cancelConfig = onSnapshot(doc(db, 'gastos_config', 'general'), (snap) => {
        S.config = snap.exists() ? normalizarConfig(snap.data()) : { modo: 'productos', categorias: [] };
        S.configEstado = 'ok'; S.configError = '';
        pedirRender();
    }, (e) => { console.error('Configuración de gastos:', e); S.configEstado = 'error'; S.configError = textoError(e); anotarPermiso(e, 'gastos_config'); pedirRender(); });
    S.cancelResumenes = onSnapshot(collection(db, 'gastos_resumenes'), (snap) => {
        const por = {};
        snap.forEach((d) => { if (L.mesValido(d.id)) por[d.id] = d.data(); });
        S.resumenes = por; S.resumenesEstado = 'ok';
        resolverResumenes();
        pedirRender();
    }, (e) => { console.error('Resúmenes:', e); S.resumenesEstado = 'error'; anotarPermiso(e, 'gastos_resumenes'); resolverResumenes(); pedirRender(); });
}

// ---------- Productos con su costo (los mismos de Control) ----------
async function asegurarProductos(forzar) {
    if (!forzar && S.productosEstado === 'ok' && Date.now() - S.productosMs < 10 * 60 * 1000) return;
    if (S.productosPromesa) return S.productosPromesa;
    S.productosPromesa = (async () => {
        try {
            const snap = await conTiempo(getDocs(collection(db, 'productos')), ESPERA_CARGA_MS);
            const lista = [];
            snap.forEach((d) => { const p = d.data(); p.id = d.id; lista.push(p); });
            S.productos = lista; S.productosEstado = 'ok'; S.productosMs = Date.now(); S.productosError = '';
        } catch (e) {
            S.productosEstado = 'error'; S.productosError = textoError(e); anotarPermiso(e, 'productos');
            throw e;
        } finally { S.productosPromesa = null; }
    })();
    return S.productosPromesa;
}

// ---------- Ventas del mes: se guardan en el equipo y después solo se piden las nuevas ----------
function leerCacheVentas(mes) {
    try {
        const j = JSON.parse(almacen.leer(K_VENTAS + mes) || 'null');
        if (!j || j.v !== 1 || j.mes !== mes || typeof j.cargadoEn !== 'string' || !isFinite(Date.parse(j.cargadoEn))) return null;
        const lista = L.desempaquetarVentas(j.p);
        if (!lista) return null;
        return { cargadoEn: j.cargadoEn, actualizadoEn: j.actualizadoEn || j.cargadoEn, ultimaFecha: typeof j.ultimaFecha === 'string' ? j.ultimaFecha : '', ventas: lista };
    } catch (e) { return null; }
}
function guardarCacheVentas(mes, c) {
    // Solo el mes actual y el anterior: los meses más viejos usan su resumen guardado
    const guardar = [S.mesActual, L.sumarMeses(S.mesActual, -1)];
    almacen.claves().forEach((k) => { if (k.indexOf(K_VENTAS) === 0 && guardar.indexOf(k.slice(K_VENTAS.length)) < 0) almacen.borrar(k); });
    if (guardar.indexOf(mes) < 0) return;
    const texto = JSON.stringify({ v: 1, mes: mes, cargadoEn: c.cargadoEn, actualizadoEn: c.actualizadoEn, ultimaFecha: L.ultimaFechaVentas(c.ventas), p: L.empaquetarVentas(c.ventas) });
    if (!almacen.guardar(K_VENTAS + mes, texto)) almacen.borrar(K_VENTAS + mes);      // si no cabe, se sigue sin guardar (se pedirá todo cada vez)
}

function estadoVentas(mes) {
    return S.ventas[mes] || (S.ventas[mes] = { estado: 'nuevo', calculo: null, origen: '', actualizadoEn: '', error: '', promesa: null, pendiente: null, ms: 0, lecturas: 0 });
}
function calculoDelMes(mes) {                     // lo calculado de las ventas de ese mes, o el resumen guardado si es un mes cerrado, o null
    const est = S.ventas[mes];
    if (est && est.calculo) return est.calculo;
    if (mes < S.mesActual && L.resumenVigente(S.resumenes[mes], mes)) return L.calculoDeResumen(S.resumenes[mes]);
    return null;
}

async function obtenerVentas(mes, completo) {
    const p = REP.periodo('rango', new Date(), { desde: L.primerDia(mes), hasta: L.ultimoDia(mes) });
    const guardado = completo ? null : leerCacheVentas(mes);
    let desdeISO = p.desdeISO, base = [], cargadoEn = '', origen = 'servidor';
    if (guardado && guardado.ultimaFecha && Date.now() - Date.parse(guardado.cargadoEn) < COMPLETO_MS) {
        desdeISO = new Date(Math.max(Date.parse(p.desdeISO), Date.parse(guardado.ultimaFecha) - SOLAPE_MS)).toISOString();
        base = guardado.ventas; cargadoEn = guardado.cargadoEn; origen = 'cache';
    }
    const snap = await conTiempo(getDocs(query(collection(db, 'ventas_historial'), where('fecha', '>=', desdeISO), where('fecha', '<=', p.hastaISO))), ESPERA_CARGA_MS);
    const nuevas = [];
    snap.forEach((d) => { const v = L.compactarVenta(d.id, d.data()); if (v) nuevas.push(v); });
    const lista = L.fusionarVentas(base, nuevas);
    const ahoraISO = new Date().toISOString();
    if (!cargadoEn) cargadoEn = ahoraISO;
    guardarCacheVentas(mes, { cargadoEn: cargadoEn, actualizadoEn: ahoraISO, ventas: lista });
    return { lista: lista, origen: origen, completo: origen === 'servidor', actualizadoEn: ahoraISO, lecturas: nuevas.length };
}

function guardarResumen(mes, calculo) {
    if (!db) return;
    setDoc(doc(db, 'gastos_resumenes', mes), L.resumenDeCalculo(mes, calculo, new Date().toISOString())).catch((e) => { console.warn('No se pudo guardar el resumen de ' + mes, e); anotarPermiso(e, 'gastos_resumenes'); pedirRender(); });
}

async function ejecutarCargaVentas(mes, opc, est) {
    try {
        await esperarResumenes();
        const cerrado = mes < S.mesActual;
        const res = S.resumenes[mes];
        if (cerrado && !opc.completo && L.resumenVigente(res, mes)) {
            est.calculo = L.calculoDeResumen(res); est.origen = 'resumen'; est.actualizadoEn = res.calculadoEn; est.lecturas = 0;
            est.estado = 'ok'; est.error = ''; est.ms = Date.now();
            return;
        }
        await asegurarProductos(!!opc.completo);
        const r = await obtenerVentas(mes, !!opc.completo);
        est.calculo = REP.calcular(r.lista, S.productos);
        est.origen = r.origen; est.actualizadoEn = r.actualizadoEn; est.lecturas = r.lecturas;
        est.estado = 'ok'; est.error = ''; est.ms = Date.now();
        if (cerrado && r.completo && L.mesSellado(mes, Date.now())) guardarResumen(mes, est.calculo);
    } catch (e) {
        console.error('Ventas de ' + mes + ':', e);
        anotarPermiso(e, 'ventas_historial');
        est.error = textoError(e);
        est.estado = est.calculo ? 'ok' : 'error';
    }
}
// opc: { refrescar: pedir las ventas nuevas aunque se haya calculado hace poco, completo: volver a leer todo el mes }
function cargarVentas(mes, opc) {
    opc = opc || {};
    if (!db || !L.mesValido(mes)) return Promise.resolve();
    const est = estadoVentas(mes);
    if (est.promesa) {
        if (!opc.completo && !opc.refrescar) return est.promesa;
        // Ya hay una lectura en curso: se pide otra para cuando termine, UNA sola vez aunque se toque «Actualizar» muchas veces
        if (est.pendiente) { if (opc.completo) est.pendiente.completo = true; return est.pendiente.promesa; }
        const pendiente = est.pendiente = { completo: !!opc.completo, promesa: null };
        pendiente.promesa = est.promesa.then(() => { est.pendiente = null; return cargarVentas(mes, { refrescar: true, completo: pendiente.completo }); });
        return pendiente.promesa;
    }
    if (!opc.completo && !opc.refrescar && est.estado === 'ok' && Date.now() - est.ms < VIGENTE_MS) return Promise.resolve();
    est.estado = est.calculo ? 'actualizando' : 'cargando';
    est.error = '';
    pedirRender();
    est.promesa = ejecutarCargaVentas(mes, opc, est).then(() => { est.promesa = null; pedirRender(); });
    return est.promesa;
}
function refrescarVentasSiHaceFalta() {
    const est = S.ventas[S.mes];
    if (!est || est.promesa || est.estado === 'cargando') return;
    if (S.mes === S.mesActual && Date.now() - est.ms > REFRESCO_MS) cargarVentas(S.mes, { refrescar: true });
}

// Calcula los meses anteriores que todavía no tienen su resumen (de uno en uno, para no pedir todo junto)
async function cargarHistorial() {
    if (S.historial.cargando) return;
    const faltan = [];
    for (let i = 1; i < MESES_HISTORIAL; i++) { const m = L.sumarMeses(S.mesActual, -i); if (!calculoDelMes(m)) faltan.push(m); }
    S.historial = { cargando: true, hecho: 0, total: faltan.length };
    pedirRender();
    for (const m of faltan) {
        if (!S.desbloqueado) break;
        await cargarVentas(m);
        S.historial.hecho++;
        pedirRender();
    }
    S.historial.cargando = false;
    pedirRender();
}

// ---------- Escribir (no se espera al servidor: si no hay señal queda en cola y se envía sola) ----------
function nuevoId() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function escribir(promesa, textoFalla, coleccion) {
    promesa.catch((e) => {
        console.error(textoFalla, e);
        anotarPermiso(e, coleccion || 'gastos');
        avisar(textoFalla + ' ' + textoError(e), { error: true });
        pedirRender();
    });
}
function registroGasto(f) {
    const ahoraISO = new Date().toISOString();
    const r = { monto: f.monto, categoria: f.categoria, catNombre: f.catNombre || '', concepto: f.concepto || '', fecha: f.fecha, periodo: L.mesDe(f.fecha), metodo: f.metodo || '', creado: f.creado || ahoraISO, actualizado: ahoraISO };
    if (f.fijoId) { r.fijoId = f.fijoId; r.ocurrencia = f.ocurrencia || ''; }
    return r;
}
function guardarGasto(f, id) {
    id = id || nuevoId();
    if (f.metodo) { S.ultimoMetodo = f.metodo; almacen.guardar(K_METODO, f.metodo); }
    escribir(setDoc(doc(db, 'gastos', id), registroGasto(f)), 'No se pudo guardar el gasto.', 'gastos');
    return id;
}
function borrarGasto(id) { escribir(deleteDoc(doc(db, 'gastos', id)), 'No se pudo eliminar el gasto.', 'gastos'); }
function pagarOcurrencia(fijo, clave, datos) {              // el pago tiene un número fijo (fijo + ocurrencia): tocar dos veces no lo duplica
    const id = L.idPago(fijo.id, clave);
    const cat = L.categoriaDe(fijo.categoria, S.config.categorias, fijo.catNombre);
    guardarGasto({ monto: datos.monto, categoria: fijo.categoria, catNombre: cat.nombre, concepto: fijo.nombre, fecha: datos.fecha, metodo: datos.metodo || fijo.metodo || S.ultimoMetodo, fijoId: fijo.id, ocurrencia: clave }, id);
    return id;
}
function registroFijo(f) {
    const ahoraISO = new Date().toISOString();
    return { nombre: f.nombre, categoria: f.categoria, catNombre: f.catNombre || '', monto: f.monto, variable: !!f.variable, frecuencia: f.frecuencia, dia: f.dia, cadaMeses: f.cadaMeses, desde: f.desde || '', hasta: f.hasta || '', metodo: f.metodo || '', nota: f.nota || '', creado: f.creado || ahoraISO, actualizado: ahoraISO };
}
function guardarFijo(f, id) {
    id = id || nuevoId();
    escribir(setDoc(doc(db, 'gastos_fijos', id), registroFijo(f)), 'No se pudo guardar el pago fijo.', 'gastos_fijos');
    return id;
}
function borrarFijo(id) { escribir(deleteDoc(doc(db, 'gastos_fijos', id)), 'No se pudo eliminar el pago fijo.', 'gastos_fijos'); }
function guardarConfig(parcial) {
    const nueva = Object.assign({}, S.config, parcial);
    escribir(setDoc(doc(db, 'gastos_config', 'general'), { modoMercaderia: nueva.modo, categorias: nueva.categorias, actualizado: new Date().toISOString() }), 'No se pudo guardar el cambio.', 'gastos_config');
}


// ===================== PANTALLAS =====================
const REGLAS = 'match /gastos/{id} { allow read, write: if true; }\nmatch /gastos_fijos/{id} { allow read, write: if true; }\nmatch /gastos_config/{id} { allow read, write: if true; }\nmatch /gastos_resumenes/{id} { allow read, write: if true; }';
// Las cuatro colecciones nuevas siempre; y, si Firebase también negó leer lo de Control, esas dos (solo lectura)
function reglasQueFaltan() {
    return REGLAS + ['ventas_historial', 'productos'].filter((c) => S.permisos.indexOf(c) >= 0).map((c) => '\nmatch /' + c + '/{id} { allow read: if true; }').join('');
}

const gastosDelMes = (mes) => S.gastos.filter((g) => g.periodo === mes);
const sumaGastos = (lista) => lista.reduce((a, g) => a + g.monto, 0);
const menos = (n) => (n > 0 ? '−' + dinero(n) : dinero(0));
const conSigno = (n) => (n < 0 ? '−' + dinero(-n) : dinero(n));            // los negativos con el signo «−» de verdad, no con un guion
const pluralDia = (d) => (/s$/.test(d) ? d : d + 's');
const categoriaDe = (id, nombre) => L.categoriaDe(id, S.config.categorias, nombre);
const nombreMesMin = (mes) => L.nombreMesSolo(mes).toLowerCase();

function textoFrecuencia(f) {
    if (f.frecuencia === 'quincenal') return 'Cada quincena (el 15 y a fin de mes)';
    if (f.frecuencia === 'semanal') return 'Cada semana, los ' + pluralDia(L.DIAS[((f.dia % 7) + 7) % 7]);
    return (f.cadaMeses === 1 ? 'Cada mes' : 'Cada ' + f.cadaMeses + ' meses') + ', el ' + f.dia;
}
// Lo que toca pagar en un mes y, si es el mes actual, lo que quedó vencido del mes pasado
function pagosDe(mes) {
    const lista = L.pagosDelMes(S.fijos, S.gastos, mes, S.hoy);
    const anteriores = mes === S.mesActual ? L.pagosDelMes(S.fijos, S.gastos, L.sumarMeses(mes, -1), S.hoy).filter((p) => p.estado === 'vencido') : [];
    return { lista: lista, anteriores: anteriores };
}
const montoPago = (p) => (p.fijo.variable ? '≈ ' : '') + dinero(p.fijo.monto);

// ---------- Avisos de arriba ----------
function bannerPermisos() {
    if (!S.permisos.length) return '';
    return '<section class="banner banner-mal" role="alert"><h2 class="banner-tit">Firebase no dejó usar: ' + esc(S.permisos.join(', ')) + '</h2>' +
        '<p>Hay que permitir esas colecciones en las reglas de Firestore (Firebase, Firestore Database, Reglas). Las reglas de abajo son tan abiertas como las que ya usan Control y el Menú.</p>' +
        '<details class="reglas"><summary>Ver las reglas que faltan</summary><pre>' + esc(reglasQueFaltan()) + '</pre><button type="button" class="btn btn-sec btn-chico" data-act="copiar-reglas">Copiar las reglas</button></details></section>';
}
function bannerErrores() {
    if (S.permisos.length) return '';
    const textos = [];
    [['gastos', S.gastosEstado, S.gastosError], ['pagos fijos', S.fijosEstado, S.fijosError], ['ajustes', S.configEstado, S.configError]].forEach((x) => { if (x[1] === 'error' && textos.indexOf(x[2]) < 0) textos.push(x[2]); });
    if (!textos.length) return '';
    return '<section class="banner banner-mal" role="alert"><h2 class="banner-tit">No se pudieron cargar los datos</h2><p>' + esc(textos.join(' ')) + '</p><button type="button" class="btn btn-sec btn-chico" data-act="reintentar">Reintentar</button></section>';
}

// ---------- Resumen ----------
function htmlNota(texto) { return '<li class="nota">' + icono('info', 18) + '<span>' + texto + '</span></li>'; }

function htmlPapel(c, est, mes) {
    const nombre = nombreMesMin(mes), actual = mes === S.mesActual;
    const titulo = 'Lo que te queda en ' + nombre + (actual ? ', hasta hoy' : '');
    const cargando = S.gastosEstado === 'cargando' || (!c.listo && (!est || est.estado === 'nuevo' || est.estado === 'cargando'));
    if (cargando) {
        return '<section class="papel papel-carga" aria-busy="true" aria-label="Calculando"><h2 class="papel-titulo">' + esc(titulo) + '</h2><div class="esqueleto esq-grande"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea esq-corta"></div><p class="papel-nota-carga">Calculando las ventas de ' + esc(nombre) + '…</p></section>';
    }
    if (!c.listo) {      // no se pudieron leer las ventas: igual se muestran los gastos
        return '<section class="papel"><h2 class="papel-titulo">' + esc(titulo) + '</h2><p class="papel-total papel-total-raya">—</p><p class="papel-sub">No se pudieron cargar las ventas' + (est && est.error ? ': ' + esc(est.error) : '.') + '</p>' +
            '<ul class="libro"><li class="libro-fila"><span class="libro-t">Gastos anotados</span><span class="guia" aria-hidden="true"></span><span class="libro-v">' + dinero(c.gastosTotal) + '</span></li></ul>' +
            '<button type="button" class="btn btn-chico papel-btn" data-act="actualizar">' + icono('refrescar', 18) + ' Reintentar</button></section>';
    }
    let h = '<section class="papel" aria-labelledby="papel-t"><h2 id="papel-t" class="papel-titulo">' + esc(titulo) + '</h2>';
    const filas = [], notas = [];
    const fila = (t, v, nota) => { filas.push('<li class="libro-fila"><span class="libro-t">' + t + '</span><span class="guia" aria-hidden="true"></span><span class="libro-v">' + v + '</span></li>' + (nota ? '<li class="libro-nota">' + nota + '</li>' : '')); };
    const enlaceGastos = c.gastosCantidad ? '<button type="button" class="enlace" data-act="ir" data-vista="gastos">' + c.gastosCantidad + (c.gastosCantidad === 1 ? ' gasto anotado' : ' gastos anotados') + '</button>' : 'Todavía no hay gastos anotados';
    if (!c.calculable) {
        h += '<p class="papel-total papel-total-raya">—</p><p class="papel-sub">Faltan los costos de tus productos para saber la ganancia.</p>';
        fila('Total vendido', dinero(c.ventas));
        fila('Menos: gastos del negocio', menos(c.gastosRestados), enlaceGastos);
        fila('Queda, sin descontar la mercadería', dinero(c.antesDeMercaderia), 'Es solo una idea: no incluye lo que costó lo que vendiste.');
        notas.push(htmlNota('Anota cuánto cuesta cada producto en Control (Costos y márgenes) y aquí verás la ganancia real. También puedes cambiar a «Con lo que compro de mercadería» en la pestaña Más.'));
    } else {
        const clase = c.neto > 0 ? ' papel-total-pos' : (c.neto < 0 ? ' papel-total-neg' : '');
        h += '<p class="papel-total' + clase + '">' + conSigno(c.neto) + '</p>';
        if (c.neto < 0) h += '<p class="papel-sub">Los gastos son mayores que lo que ganaste vendiendo.</p>';
        else if (c.margen !== null) h += '<p class="papel-sub">Equivale al ' + L.porcentaje(c.margen) + ' % de lo que vendiste.</p>';
        else h += '<p class="papel-sub">Todavía no hay ventas en ' + esc(nombre) + '.</p>';
        if (c.modo === 'productos') {
            const detalle = c.ventasProductos > 0 ? 'Vendiste ' + dinero(c.ventasConCosto) + ' en productos con costo anotado y esos productos costaron ' + dinero(c.costo) + '.' : 'Todavía no hay ventas de productos en este mes.';
            fila('Ganancia de las ventas', dinero(c.ganancia), esc(detalle));
            fila('Menos: gastos del negocio', menos(c.gastosRestados), enlaceGastos + (c.mercaderiaNoRestada > 0 ? '. No incluye ' + dinero(c.mercaderiaNoRestada) + ' de mercadería: ya está en el costo de los productos.' : ''));
        } else {
            fila('Ventas del mes', dinero(c.ventas), c.fiados.cantidad ? 'Incluye ' + dinero(c.fiados.total) + ' cobrados de cuentas fiadas.' : '');
            fila('Menos: compras de mercadería', menos(c.compras));
            fila('Menos: otros gastos', menos(c.otrosGastos), enlaceGastos);
        }
    }
    h += '<ul class="libro">' + filas.join('') + '</ul>';
    if (c.modo === 'productos') h += '<p class="papel-pie">Total vendido en ' + esc(nombre) + ': ' + dinero(c.ventas) + (c.numVentas ? ' · ' + c.numVentas + (c.numVentas === 1 ? ' venta' : ' ventas') : '') + '</p>';
    if (c.aviso === 'costos-parciales') notas.push(htmlNota('Falta el costo de productos por ' + dinero(c.sinCosto) + ' vendidos: su ganancia no está en esta cuenta (hay costo anotado en el ' + L.porcentajeAbajo(c.cobertura) + ' % de lo vendido). Complétalo en Control, «Costos y márgenes».'));
    if (c.modo === 'productos' && c.fiados.cantidad > 0) notas.push(htmlNota('Se cobraron ' + dinero(c.fiados.total) + ' de cuentas fiadas (' + c.fiados.cantidad + '). No cuentan en la ganancia porque no se sabe qué productos eran.'));
    if (actual && c.calculable) {
        const pend = L.resumenPagos(pagosDe(mes).lista.concat(pagosDe(mes).anteriores));
        if (pend.pendientes > 0 && pend.montoPendiente > 0) notas.push(htmlNota('Faltan ' + dinero(pend.montoPendiente) + ' de pagos fijos por pagar. Cuando los pagues te quedarían ' + conSigno(c.neto - pend.montoPendiente) + '.'));
    }
    if (est && est.error && c.listo) notas.push(htmlNota('No se pudieron actualizar las ventas (' + esc(est.error) + '). Se muestran las de antes.'));
    if (notas.length) h += '<ul class="notas">' + notas.join('') + '</ul>';
    // Cuándo se leyeron las ventas
    if (est && est.actualizadoEn) {
        const cuando = est.origen === 'resumen' ? 'Resumen del mes guardado ' + hace(est.actualizadoEn) : 'Ventas al ' + fechaHoraCorta(est.actualizadoEn);
        const boton = est.origen === 'resumen' ? '<button type="button" class="enlace" data-act="recalcular">Volver a calcular</button>' : '<button type="button" class="enlace" data-act="actualizar">' + (est.estado === 'actualizando' ? 'Actualizando…' : 'Actualizar') + '</button>';
        h += '<p class="papel-actualiz">' + esc(cuando) + ' · ' + boton + '</p>';
    }
    return h + '</section>';
}

function htmlPorPagar(mes) {
    if (S.fijosEstado !== 'ok') return '';
    if (!S.fijos.length) {
        return '<section class="bloque"><h2 class="bloque-tit">Pagos de siempre</h2><p class="bloque-texto">Anota una vez la planilla, el alquiler, la luz, el agua y el internet. Cada mes verás aquí cuáles faltan por pagar.</p><button type="button" class="btn btn-sec" data-act="nuevo-fijo">' + icono('plus', 18) + ' Agregar un pago fijo</button></section>';
    }
    const p = pagosDe(mes);
    const faltan = p.anteriores.concat(p.lista).filter((x) => x.estado !== 'pagado');
    const titulo = mes < S.mesActual ? 'Quedó sin pagar' : 'Por pagar';
    if (!faltan.length) {
        return '<section class="bloque"><h2 class="bloque-tit">' + titulo + '</h2><p class="bloque-ok">' + icono('check', 20) + '<span>' + (p.lista.length ? 'Todo al día en ' + esc(nombreMesMin(mes)) + '.' : 'No hay pagos fijos que toquen en ' + esc(nombreMesMin(mes)) + '.') + '</span></p></section>';
    }
    const ver = faltan.slice(0, 4);
    let h = '<section class="bloque"><h2 class="bloque-tit">' + titulo + '</h2><ul class="filas">' + ver.map(htmlFilaPago).join('') + '</ul>';
    if (faltan.length > ver.length) h += '<button type="button" class="enlace enlace-bloque" data-act="ir" data-vista="fijos">Ver los ' + faltan.length + ' pagos que faltan</button>';
    return h + '</section>';
}

function htmlCategorias(c) {
    if (!c.listo && !c.gastosCantidad) return '';
    const mes = S.mes, nombre = nombreMesMin(mes);
    if (!c.gastosCantidad) return '<section class="bloque"><h2 class="bloque-tit">En qué se fue el dinero</h2><p class="bloque-texto">Todavía no hay gastos anotados en ' + esc(nombre) + '.</p><button type="button" class="btn btn-sec" data-act="nuevo-gasto">' + icono('plus', 18) + ' Anotar un gasto</button></section>';
    const total = c.gastosRestados;
    let h = '<section class="bloque"><h2 class="bloque-tit">En qué se fue el dinero</h2>';
    if (c.porCategoria.length) {
        h += '<ul class="cats">' + c.porCategoria.map((x) => {
            const cat = categoriaDe(x.id, x.nombre), pct = total > 0 ? x.total / total * 100 : 0;
            return '<li class="cat-fila"><span class="cat-emoji" aria-hidden="true">' + esc(cat.emoji) + '</span><div class="cat-cuerpo"><div class="cat-linea"><span class="cat-nombre">' + esc(cat.nombre) + '</span><span class="cat-monto">' + dinero(x.total) + '</span></div>' +
                '<div class="cat-barra"><div class="barra" aria-hidden="true"><i style="width:' + Math.max(2, Math.round(pct)) + '%"></i></div><span class="cat-pct">' + Math.round(pct) + ' %</span></div></div></li>';
        }).join('') + '</ul>';
    }
    if (c.modo === 'productos' && c.mercaderiaNoRestada > 0) {
        h += '<p class="cat-aparte"><span class="cat-emoji" aria-hidden="true">' + esc(categoriaDe('mercaderia', '').emoji) + '</span><span>Mercadería: ' + dinero(c.mercaderiaNoRestada) + '. Está anotada pero no se resta, porque ya está en el costo de los productos.</span></p>';
    }
    return h + '</section>';
}

function htmlHistorial() {
    const meses = [];
    for (let i = 0; i < MESES_HISTORIAL; i++) meses.push(L.sumarMeses(S.mesActual, -i));
    const filas = meses.map((m) => { const calc = calculoDelMes(m); return { mes: m, calc: calc, c: L.cuentaDelMes({ calculo: calc, gastos: gastosDelMes(m), modo: S.config.modo }) }; });
    const conValor = filas.filter((f) => f.calc && f.c.calculable);
    const faltan = filas.filter((f) => !f.calc && f.mes !== S.mesActual).length;
    if (!conValor.length && !faltan) return '';
    const max = conValor.reduce((a, f) => Math.max(a, Math.abs(f.c.neto)), 0) || 1;
    let h = '<section class="bloque"><h2 class="bloque-tit">Cómo van los meses</h2><ul class="hist">' + filas.map((f) => {
        const ok = f.calc && f.c.calculable;
        const pct = ok ? Math.max(2, Math.round(Math.abs(f.c.neto) / max * 100)) : 0;
        return '<li><button type="button" class="hist-fila' + (f.mes === S.mes ? ' hist-activo' : '') + '" data-act="ir-mes" data-mes="' + f.mes + '"><span class="hist-mes">' + esc(L.nombreMesSolo(f.mes)) + '</span>' +
            '<span class="hist-barra" aria-hidden="true">' + (ok ? '<i class="' + (f.c.neto < 0 ? 'neg' : '') + '" style="width:' + pct + '%"></i>' : '') + '</span>' +
            '<span class="hist-monto' + (ok && f.c.neto < 0 ? ' neg' : '') + '">' + (ok ? conSigno(f.c.neto) : '—') + '</span></button></li>';
    }).join('') + '</ul>';
    if (S.historial.cargando) h += '<p class="bloque-texto">Calculando los meses anteriores… ' + S.historial.hecho + ' de ' + S.historial.total + '</p>';
    else if (faltan) h += '<button type="button" class="btn btn-sec btn-chico" data-act="cargar-historial">Calcular los meses anteriores</button><p class="bloque-nota">Cada mes se lee una sola vez y queda guardado.</p>';
    return h + '</section>';
}

function vistaResumen() {
    const mes = S.mes, est = S.ventas[mes];
    const c = L.cuentaDelMes({ calculo: calculoDelMes(mes), gastos: gastosDelMes(mes), modo: S.config.modo });
    return bannerPermisos() + bannerErrores() + htmlPapel(c, est, mes) + htmlPorPagar(mes) + htmlCategorias(c) + htmlHistorial();
}

// ---------- Filas ----------
function htmlFilaGasto(g) {
    const cat = categoriaDe(g.categoria, g.catNombre);
    const titulo = g.concepto || cat.nombre;
    const sub = [g.concepto ? cat.nombre : '', g.metodo, g.fijoId ? 'Pago fijo' : ''].filter(Boolean).join(' · ');
    return '<li><button type="button" class="fila" data-act="editar-gasto" data-id="' + esc(g.id) + '"><span class="fila-icono" aria-hidden="true">' + esc(cat.emoji) + '</span><span class="fila-texto"><span class="fila-titulo">' + esc(titulo) + '</span>' + (sub ? '<span class="fila-sub">' + esc(sub) + '</span>' : '') + '</span><span class="fila-monto">' + dinero(g.monto) + '</span></button></li>';
}
function htmlFilaPago(p) {
    const cat = categoriaDe(p.fijo.categoria, p.fijo.catNombre);
    const estado = p.estado;
    let sub;
    if (estado === 'pagado') sub = 'Pagado el ' + L.fechaCorta(p.pago.fecha, S.hoy) + ' · ' + dinero(p.pago.monto);
    else sub = L.textoVencimiento(p.fecha, S.hoy) + ' · ' + montoPago(p);
    const boton = estado === 'pagado'
        ? '<button type="button" class="btn btn-sec btn-chico" data-act="pago-ver" data-id="' + esc(p.pago.id) + '">Ver</button>'
        : '<button type="button" class="btn btn-chico" data-act="pagar" data-fijo="' + esc(p.fijo.id) + '" data-clave="' + esc(p.clave) + '">Pagar</button>';
    return '<li class="fila fila-pago est-' + estado + '"><span class="fila-icono' + (estado === 'pagado' ? ' fila-icono-ok' : '') + '" aria-hidden="true">' + (estado === 'pagado' ? icono('check', 20) : esc(cat.emoji)) + '</span>' +
        '<span class="fila-texto"><span class="fila-titulo">' + esc(p.fijo.nombre) + '</span><span class="fila-sub fila-estado">' + esc(sub) + '</span></span>' + boton + '</li>';
}

// ---------- Gastos ----------
function vistaGastos() {
    const mes = S.mes, nombre = nombreMesMin(mes);
    let lista = gastosDelMes(mes);
    const total = sumaGastos(lista);
    const c = L.cuentaDelMes({ calculo: null, gastos: lista, modo: S.config.modo });
    let h = bannerPermisos() + bannerErrores();
    if (S.gastosEstado === 'cargando') return h + '<section class="bloque" aria-busy="true"><div class="esqueleto esq-grande"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea"></div></section>';
    // Categorías que tienen gastos este mes
    const porCat = Object.create(null), orden = [];
    lista.forEach((g) => { if (!porCat[g.categoria]) { porCat[g.categoria] = { id: g.categoria, nombre: g.catNombre, n: 0 }; orden.push(g.categoria); } porCat[g.categoria].n++; });
    if (S.filtroCat && !porCat[S.filtroCat]) S.filtroCat = '';
    h += '<section class="bloque bloque-total"><p class="bloque-linea">Anotado en ' + esc(nombre) + '</p><p class="gran">' + dinero(total) + '</p>' +
        '<p class="peq">' + lista.length + (lista.length === 1 ? ' gasto' : ' gastos') + (c.mercaderiaNoRestada > 0 ? ' · ' + dinero(c.mercaderiaNoRestada) + ' de mercadería no se resta de la ganancia' : '') + '</p></section>';
    if (!lista.length) {
        return h + '<section class="vacio"><p class="vacio-tit">Todavía no hay gastos en ' + esc(nombre) + '.</p><p class="vacio-texto">Anota lo que pagas: planilla, luz, agua, internet, mercadería…</p><button type="button" class="btn" data-act="nuevo-gasto">' + icono('plus', 18) + ' Anotar un gasto</button></section>';
    }
    if (orden.length > 1) {
        orden.sort((a, b) => categoriaDe(a, porCat[a].nombre).nombre.localeCompare(categoriaDe(b, porCat[b].nombre).nombre, 'es'));
        h += '<div class="chips" role="group" aria-label="Filtrar por categoría"><button type="button" class="chip' + (S.filtroCat ? '' : ' chip-on') + '" data-act="filtro-cat" data-cat="" aria-pressed="' + (S.filtroCat ? 'false' : 'true') + '">Todos</button>' +
            orden.map((id) => { const cat = categoriaDe(id, porCat[id].nombre); return '<button type="button" class="chip' + (S.filtroCat === id ? ' chip-on' : '') + '" data-act="filtro-cat" data-cat="' + esc(id) + '" aria-pressed="' + (S.filtroCat === id ? 'true' : 'false') + '"><span aria-hidden="true">' + esc(cat.emoji) + '</span> ' + esc(cat.nombre) + ' <span class="chip-n">' + porCat[id].n + '</span></button>'; }).join('') + '</div>';
    }
    if (S.filtroCat) lista = lista.filter((g) => g.categoria === S.filtroCat);
    lista.sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (a.creado < b.creado ? 1 : a.creado > b.creado ? -1 : 0)));
    const dias = [];
    lista.forEach((g) => { const u = dias[dias.length - 1]; if (u && u.fecha === g.fecha) u.items.push(g); else dias.push({ fecha: g.fecha, items: [g] }); });
    h += dias.map((d) => '<section class="dia"><h2 class="dia-tit"><span>' + esc(L.etiquetaDia(d.fecha, S.hoy)) + '</span><span class="dia-total">' + dinero(sumaGastos(d.items)) + '</span></h2><ul class="filas">' + d.items.map(htmlFilaGasto).join('') + '</ul></section>').join('');
    return h;
}

// ---------- Pagos fijos ----------
function vistaFijos() {
    const mes = S.mes, nombre = nombreMesMin(mes);
    let h = bannerPermisos() + bannerErrores();
    if (S.fijosEstado === 'cargando' || S.gastosEstado === 'cargando') return h + '<section class="bloque" aria-busy="true"><div class="esqueleto esq-grande"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea"></div></section>';
    if (!S.fijos.length) {
        return h + '<section class="vacio"><p class="vacio-tit">Aquí van los pagos que se repiten</p><p class="vacio-texto">Planilla de cada empleado, alquiler, luz, agua, internet, cargas sociales… Anótalos una sola vez y cada mes verás cuáles ya pagaste y cuáles faltan.</p><button type="button" class="btn" data-act="nuevo-fijo">' + icono('plus', 18) + ' Agregar un pago fijo</button></section>';
    }
    const p = pagosDe(mes), res = L.resumenPagos(p.lista);
    const pct = p.lista.length ? Math.round(res.pagados / p.lista.length * 100) : 0;
    h += '<section class="bloque bloque-total"><p class="bloque-linea">Pagos fijos de ' + esc(nombre) + '</p>' +
        (p.lista.length ? '<p class="gran">' + res.pagados + ' de ' + p.lista.length + ' pagados</p><div class="progreso" role="img" aria-label="' + pct + ' % pagado"><i style="width:' + pct + '%"></i></div><p class="peq">' + (res.pendientes ? 'Faltan ' + dinero(res.montoPendiente) + (res.vencidos ? ' · ' + res.vencidos + (res.vencidos === 1 ? ' vencido' : ' vencidos') : '') : 'Todo pagado en ' + esc(nombre) + '.') + '</p>'
            : '<p class="gran">Nada por pagar</p><p class="peq">Ningún pago fijo toca en ' + esc(nombre) + '.</p>') + '</section>';
    if (p.anteriores.length) h += '<section class="dia"><h2 class="dia-tit"><span>Del mes pasado, sin pagar</span></h2><ul class="filas">' + p.anteriores.map(htmlFilaPago).join('') + '</ul></section>';
    if (p.lista.length) h += '<section class="dia"><h2 class="dia-tit"><span>Pagos de ' + esc(nombre) + '</span></h2><ul class="filas">' + p.lista.map(htmlFilaPago).join('') + '</ul></section>';
    const todos = S.fijos.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    h += '<section class="dia"><h2 class="dia-tit"><span>Todos los pagos fijos</span></h2><ul class="filas">' + todos.map((f) => {
        const cat = categoriaDe(f.categoria, f.catNombre), termino = f.hasta && f.hasta < S.hoy;
        return '<li><button type="button" class="fila" data-act="editar-fijo" data-id="' + esc(f.id) + '"><span class="fila-icono" aria-hidden="true">' + esc(cat.emoji) + '</span><span class="fila-texto"><span class="fila-titulo">' + esc(f.nombre) + '</span><span class="fila-sub">' +
            esc(textoFrecuencia(f) + (termino ? ' · terminó el ' + L.fechaCorta(f.hasta, S.hoy) : '')) + '</span></span><span class="fila-monto">' + (f.variable ? '≈ ' : '') + dinero(f.monto) + '</span></button></li>';

function claveFoco(el) { return el ? Array.prototype.map.call(el.attributes, (a) => (a.name.indexOf('data-') === 0 ? a.name + '=' + a.value : '')).join('|') : ''; }
function render() {

    });

    let vencidos = 0;
    if (S.fijosEstado === 'ok') { const p = pagosDe(S.mesActual); vencidos = p.lista.concat(p.anteriores).filter((x) => x.estado === 'vencido').length; }
    $('punto-fijos').hidden = vencidos === 0;
    $('fab').hidden = !(S.vista === 'resumen' || S.vista === 'gastos');
    document.body.classList.toggle('con-fab', !$('fab').hidden);          // el aviso de abajo se pone arriba del botón «Anotar gasto» para no taparlo
    const cont = $('vista');
    const html = ({ resumen: vistaResumen, gastos: vistaGastos, fijos: vistaFijos, mas: vistaMas }[S.vista] || vistaResumen)();
    if (cont.__html === html) return;
    const foco = document.activeElement && cont.contains(document.activeElement) ? claveFoco(document.activeElement) : null;
    cont.innerHTML = html;
    cont.__html = html;
    ajustarNumeros();
    if (foco) {
        const otro = Array.prototype.find.call(cont.querySelectorAll('[data-act]'), (x) => claveFoco(x) === foco);
        if (otro) { try { otro.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
    }
}
// Un número grande no se parte en dos renglones: si no cabe a su tamaño normal, la letra se achica hasta que quepa (como mínimo 18 px)
function ajustarNumeros() {
    const lista = document.querySelectorAll('#vista .papel-total, #vista .gran');
    lista.forEach((el) => { el.style.fontSize = ''; el.style.whiteSpace = ''; });
    lista.forEach((el) => {
        const ancho = el.clientWidth;
        if (!ancho) return;
        el.style.whiteSpace = 'nowrap';
        const necesita = el.scrollWidth;
        if (necesita <= ancho) { el.style.whiteSpace = ''; return; }
        const nuevo = Math.floor(parseFloat(getComputedStyle(el).fontSize) * ancho / necesita * 0.97);
        if (nuevo >= 18) el.style.fontSize = nuevo + 'px'; else el.style.whiteSpace = '';
    });
}
let ajusteNumeros = 0;

function errorCampo(id, msg) {
    const er = $(id + '-error'), inp = $(id);
    if (er) er.textContent = msg || '';
    if (inp) { if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid'); }
    return !!msg;
}
function categoriasOrdenadas(extra) {                // las que más usas primero; «Otros» al final
    const usos = Object.create(null);
    S.gastos.forEach((g) => { usos[g.categoria] = (usos[g.categoria] || 0) + 1; });
    const todas = L.todasLasCategorias(S.config.categorias), base = Object.create(null);
    todas.forEach((c, i) => { base[c.id] = i; });
    const orden = todas.slice().sort((a, b) => {
        if (a.id === 'otros') return 1;
        if (b.id === 'otros') return -1;
        return (usos[b.id] || 0) - (usos[a.id] || 0) || base[a.id] - base[b.id];
    });
    if (extra && !todas.some((c) => c.id === extra.id)) orden.unshift(extra);     // una categoría que ya no existe, para no perderla al editar
    return orden;
}
function htmlTiles(nombre, elegida, extra) {

function leerFormularioFijo() {
    const fr = FRECUENCIAS.filter((x) => x.v === $('f-frec').value)[0] || FRECUENCIAS[0];

    return { fr: fr, frecuencia: fr.frecuencia, cadaMeses: fr.cada, dia: dia, desde: $('f-desde').value, hasta: $('f-hasta').value };
}
function actualizarProximo() {
    const el = $('f-proximo');
    if (!el || !$('f-frec')) return;
    const x = leerFormularioFijo();
    if (x.frecuencia === 'mensual' && !(Number.isInteger(x.dia) && x.dia >= 1 && x.dia <= 31)) { el.textContent = ''; return; }
    if (!L.fechaValida(x.desde)) { el.textContent = ''; return; }
    const p = L.proximoPago({ frecuencia: x.frecuencia, cadaMeses: x.cadaMeses, dia: x.dia, desde: x.desde, hasta: L.fechaValida(x.hasta) ? x.hasta : '' }, S.hoy);
    el.textContent = p ? 'Próximo pago: ' + (p === S.hoy ? 'hoy, ' : '') + L.fechaLarga(p, S.hoy) + '.' : 'Con estas fechas no hay próximos pagos.';
}
function enviarFijo() {
    const h = S.hoja;
    if (!h || h.tipo !== 'fijo' || h.guardando) return;
    const previo = h.datos.fijo;
    const nombre = L.textoSeguro($('f-nombre').value, 60), cat = valorRadio('f-cat'), monto = L.parseMonto($('f-monto').value), x = leerFormularioFijo();
    const nota = L.textoSeguro($('f-nota').value, 120), metodo = valorRadio('f-metodo');
    const malN = errorCampo('f-nombre', nombre ? '' : 'Escribe el nombre.');
    const malC = errorCampo('f-cat', cat ? '' : 'Escoge una categoría.');
    const malM = errorCampo('f-monto', L.errorMonto(monto));
    const malD = errorCampo('f-dia', (x.frecuencia !== 'mensual' || (Number.isInteger(x.dia) && x.dia >= 1 && x.dia <= 31)) ? '' : 'Escribe un día del 1 al 31.');
    const malDe = errorCampo('f-desde', L.fechaValida(x.desde) ? '' : 'Escoge una fecha.');
    const malH = errorCampo('f-hasta', !x.hasta || (L.fechaValida(x.hasta) && (!L.fechaValida(x.desde) || x.hasta >= x.desde)) ? '' : 'Tiene que ser una fecha igual o posterior a cuando empieza.');
    if (malN || malC || malM || malD || malDe || malH) {
        if (malH) { const d = hojaEl.querySelector('details'); if (d) d.open = true; }
        primerCampoConError(['f-nombre', 'f-monto', 'f-dia', 'f-desde', 'f-hasta']);
        if (malC && !malN && !malM && !malD && !malDe && !malH) { const t = hojaEl.querySelector('.tile input'); if (t) t.focus(); }
        return;
    }
    h.guardando = true;
    const c = categoriaDe(cat, previo ? previo.catNombre : '');
    guardarFijo({ nombre: nombre, categoria: cat, catNombre: c.nombre, monto: monto, variable: $('f-variable').checked, frecuencia: x.frecuencia, dia: x.dia, cadaMeses: x.cadaMeses, desde: x.desde, hasta: x.hasta, metodo: metodo, nota: nota, creado: previo ? previo.creado : '' }, previo ? previo.id : null);
    cerrarHoja();
    avisar(previo ? 'Cambios guardados.' : 'Pago fijo guardado: ' + nombre);
}
function terminarFijo(id) {
    const f = S.fijos.find((x) => x.id === id);

async function eliminarFijo(id) {
    const f = S.fijos.find((x) => x.id === id);

// estado: lo que acaba de pasar dentro de esta misma hoja ({ texto, devolver }). No se usa el aviso de abajo porque una hoja abierta lo taparía y no se podría tocar «Deshacer»
function hojaCategorias(lista, estado) {
    const propias = lista || S.config.categorias.slice();
    const cuerpo = (estado ? '<p class="hoja-estado" role="status">' + esc(estado.texto) + (estado.devolver ? ' <button type="button" class="enlace" data-act="cat-deshacer">Deshacer</button>' : '') + '</p>' : '') + '<p class="hoja-sub">Estas son las de fábrica. Abajo puedes agregar las tuyas.</p><ul class="cat-lista">' + L.CATEGORIAS.map((c) => '<li><span class="cat-emoji" aria-hidden="true">' + esc(c.emoji) + '</span><span>' + esc(c.nombre) + '</span></li>').join('') + '</ul>' +
