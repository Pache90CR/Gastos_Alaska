        '<button type="submit" class="btn">Agregar</button></form><p id="c-nombre-error" class="error-campo" role="alert"></p>';
    abrirHoja({ tipo: 'categorias', titulo: 'Categorías de gastos', cuerpo: cuerpo, cerrarConFondo: true, datos: { propias: propias, devolver: estado && estado.devolver ? estado.devolver : null } });
}
const MARCAS_TILDE = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
const sinTildes = (s) => String(s).normalize('NFD').replace(MARCAS_TILDE, '').toLowerCase().trim();
function enviarCategoria() {
    const h = S.hoja;
    if (!h || h.tipo !== 'categorias') return;
    const nombre = L.textoSeguro($('c-nombre').value, 30), emoji = L.primerEmoji($('c-emoji').value) || '🏷️';
    const todas = L.todasLasCategorias(h.datos.propias);
    let msg = '';
    if (!nombre) msg = 'Escribe el nombre de la categoría.';
    else if (todas.some((c) => sinTildes(c.nombre) === sinTildes(nombre))) msg = 'Ya existe una categoría con ese nombre.';
    else if (h.datos.propias.length >= 30) msg = 'Llegaste al máximo de 30 categorías propias.';
    if (errorCampo('c-nombre', msg)) { $('c-nombre').focus(); return; }
    const nueva = h.datos.propias.concat([{ id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nombre: nombre, emoji: emoji }]);
    guardarConfig({ categorias: nueva });
    hojaCategorias(nueva, { texto: 'Categoría agregada: ' + nombre + '.' });
}
function quitarCategoria(id) {
    const h = S.hoja;
    if (!h || h.tipo !== 'categorias') return;
    const c = h.datos.propias.filter((x) => x.id === id)[0];
    if (!c) return;
    const antes = h.datos.propias, nueva = antes.filter((x) => x.id !== id);
    guardarConfig({ categorias: nueva });
    hojaCategorias(nueva, { texto: 'Categoría quitada: ' + c.nombre + '. Los gastos que ya tenía se quedan con su nombre.', devolver: antes });
}
function devolverCategoria() {
    const h = S.hoja;
    if (!h || h.tipo !== 'categorias' || !h.datos.devolver) return;
    const antes = h.datos.devolver;
    guardarConfig({ categorias: antes });
    hojaCategorias(antes, { texto: 'Categoría devuelta.' });
}

// ---------- Informe del mes y otras acciones ----------
let exportando = false, ultimoExportar = 0;
async function exportarMes(formato) {
    if (exportando || Date.now() - ultimoExportar < 1500) return;          // un doble toque no baja dos archivos
    exportando = true;
    ultimoExportar = Date.now();
    try {
        if (!EXP) throw new Error('Falta cargar el exportador. Actualiza la página.');
        const mes = S.mes, calculo = calculoDelMes(mes), gm = gastosDelMes(mes);
        if (!gm.length && !calculo) return avisar('Todavía no hay nada que exportar en ' + nombreMesMin(mes) + '.', { error: true });
        const cuenta = L.cuentaDelMes({ calculo: calculo, gastos: gm, modo: S.config.modo });
        const r = L.documentoDelMes({ mes: mes, cuenta: cuenta, gastos: gm, personalizadas: S.config.categorias, ahora: new Date() });
        if (formato === 'xlsx') {
            EXP.descargar(EXP.xlsx(r.doc), r.nombre + '.xlsx', EXP.MIME.xlsx);
            avisar('Excel listo: ' + r.nombre + '.xlsx (mira en Descargas)');
        } else if (formato === 'pdf') {
            EXP.descargar(EXP.pdf(r.doc), r.nombre + '.pdf', EXP.MIME.pdf);
            avisar('PDF listo: ' + r.nombre + '.pdf (mira en Descargas)');
        } else {
            const bytes = EXP.pdf(r.doc);
            const res = await EXP.compartir(bytes, r.nombre + '.pdf', EXP.MIME.pdf, 'Bar Restaurante Alaska — Gastos y ganancia', r.texto);
            if (res === 'compartido' || res === 'cancelado') return;
            EXP.descargar(bytes, r.nombre + '.pdf', EXP.MIME.pdf);
            window.open(EXP.urlWhatsApp(r.texto), '_blank', 'noopener');
            avisar('Se bajó el PDF y se abrió WhatsApp con el resumen. Para mandar también el archivo, adjúntalo desde Descargas.', { ms: 9000 });
        }
    } catch (e) {
        console.error('Exportar:', e);
        avisar('No se pudo preparar el archivo. ' + (e && e.message ? e.message : ''), { error: true });
    } finally { exportando = false; }
}
async function copiarReglas() {
    const reglas = reglasQueFaltan();
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(reglas);
        else {
            const t = document.createElement('textarea');
            t.value = reglas; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
            document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
        }
        avisar('Reglas copiadas.');
    } catch (e) { avisar('No se pudo copiar. Selecciona el texto y cópialo a mano.', { error: true }); }
}
function irAMes(mes) {
    if (!L.mesValido(mes) || mes > S.mesActual || mes < mesMinimo()) return;
    S.mes = mes; S.filtroCat = '';
    asegurarGastosDesde(mes);
    render();
    window.scrollTo(0, 0);
    cargarVentas(mes);
}

function irAVista(v) {
    if (['resumen', 'gastos', 'fijos', 'mas'].indexOf(v) < 0) return;
    S.vista = v;
    render();
    window.scrollTo(0, 0);
    const vista = $('vista'); try { vista.focus({ preventScroll: true }); } catch (e) { /* nada */ }
}
function reiniciarDatos() {         // vuelve a conectar las listas (después de un error de conexión)
    [S.cancelGastos, S.cancelFijos, S.cancelConfig, S.cancelResumenes].forEach((f) => { if (f) { try { f(); } catch (e) { /* nada */ } } });
    S.gastosEstado = S.fijosEstado = S.configEstado = 'cargando';
    S.permisos = [];
    iniciarDatos();
    pedirRender();
}
const porId = (lista, el) => lista.filter((x) => x.id === el.getAttribute('data-id'))[0];

const acciones = {
    'ir'(el) { irAVista(el.getAttribute('data-vista')); },
    'mes-ant'() { irAMes(L.sumarMeses(S.mes, -1)); },
    'mes-sig'() { irAMes(L.sumarMeses(S.mes, 1)); },
    'mes-actual'() { irAMes(S.mesActual); },
    'ir-mes'(el) { irAMes(el.getAttribute('data-mes')); },
    'bloquear'() { bloquear('manual'); },
    'nuevo-gasto'() { hojaGasto(null); },
    'editar-gasto'(el) { const g = porId(S.gastos, el); if (g) hojaGasto(g); },

    'nuevo-fijo'() { hojaFijo(null); },
    'editar-fijo'(el) { const f = porId(S.fijos, el); if (f) hojaFijo(f); },

    },

    'cargar-historial'() { cargarHistorial(); },
    'exportar'(el) { exportarMes(el.getAttribute('data-formato')); },
    'copiar-reglas'() { copiarReglas(); },
    'reintentar'() { reiniciarDatos(); cargarVentas(S.mes, { refrescar: true }); },
    'cerrar-hoja'() { cerrarHoja(); },
    'aviso-accion'() { const f = avisoAccion; ocultarAviso(); if (f) f(); }
};

// El PIN también se puede escribir con el teclado de la computadora

});

// Inactividad, segundo plano y cambio de día
['pointerdown', 'keydown', 'touchstart', 'wheel', 'input'].forEach((ev) => document.addEventListener(ev, () => { S.actividad = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
    if (!S.desbloqueado) return;
    if (Date.now() - S.actividad > INACTIVIDAD_MS) { bloquear('inactividad'); return; }
    const antes = S.hoy + S.mesActual;
    actualizarFechas();
    if (S.hoy + S.mesActual !== antes) render();
}, 15000);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { S.ocultoDesde = Date.now(); return; }
    if (!S.desbloqueado) return;
    if (S.ocultoDesde && Date.now() - S.ocultoDesde > SEGUNDO_PLANO_MS) { bloquear('inactividad'); return; }
    refrescarVentasSiHaceFalta();
    render();
});

// Si cambia el ancho (girar el celular) o termina de cargar la letra, los números grandes se vuelven a acomodar
window.addEventListener('resize', programarAjusteNumeros);
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(programarAjusteNumeros, () => {}); }

// Arranque: siempre empieza bloqueada
bloquear('inicio');
if (errorFirebase) mensajePin(errorFirebase, true);
window.__gastosListo = true;

</script>
</body>
</html>
